services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leonyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leonyx}
      POSTGRES_DB: ${POSTGRES_DB:-leonyx_flow}
    ports:
      - "5432:5432"
    volumes:
      - leonyx-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leonyx} -d ${POSTGRES_DB:-leonyx_flow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - leonyx-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  leonyx-postgres:
  leonyx-redis: