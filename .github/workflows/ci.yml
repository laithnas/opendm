name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + tests + build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leonyx
          POSTGRES_PASSWORD: leonyx
          POSTGRES_DB: leonyx_flow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leonyx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Create test database
        run: |
          PGPASSWORD=leonyx psql -h localhost -U leonyx -d postgres -c "CREATE DATABASE leonyx_flow_test"
        env:
          # psql client is available on ubuntu runners
          PGUSER: leonyx

      - name: Unit + integration tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://leonyx:leonyx@localhost:5432/leonyx_flow?schema=public
          TEST_DATABASE_URL: postgresql://leonyx:leonyx@localhost:5432/leonyx_flow_test?schema=public
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: test-session-secret-0123456789abcdef
          ENCRYPTION_KEY: test-encryption-key-0123456789abcdef

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://leonyx:leonyx@localhost:5432/leonyx_flow?schema=public
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: test-session-secret-0123456789abcdef
          ENCRYPTION_KEY: test-encryption-key-0123456789abcdef
          APP_URL: http://localhost:3000